[package]
name = "cadflow-web"
description = "CADFlow in the browser - Web CAD with Markdown Documentation"
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "cadflow-web"
path = "src/main.rs"

[dependencies]
cadcraft-engine = { path = "../cadcraft/crates/engine" }
cadcraft-geom = { path = "../cadcraft/crates/geom" }
cadcraft-ui-egui = { path = "../cadcraft/crates/ui-egui" }
cadcraft-io = { path = "../cadcraft/crates/io" }
cadcraft-doc = { path = "../cadcraft/crates/doc" }
cadcraft-color = { path = "../cadcraft/crates/color" }
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0", features = ["serde"] }
egui = "0.37"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.wasm32-unknown-unknown.dependencies]
web-sys = { version = "0.3", features = ["HtmlInputElement", "FileList", "File"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["persistence", "default_fonts", "wgpu", "accesskit"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlTextAreaElement",
    "CssStyleDeclaration", "HtmlCanvasElement", "HtmlAnchorElement",
    "Location", "Navigator", "Blob", "BlobPropertyBag", "Url",
    "MessageEvent", "UrlSearchParams", "MediaQueryList", "Response"
] }
