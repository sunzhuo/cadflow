<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>CADFlow - 数字化工程建模与文档协同平台</title>
  <link data-trunk rel="rust" data-bin="cadflow-web" data-wasm-opt="z" data-weak-refs />
  <link data-trunk rel="copy-file" href="_headers" />

  <!-- 引入 EasyMDE 与 FontAwesome 样式与脚本 -->
  <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #22282f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    #cadcraft_canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #cadcraft_loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #d7dbe0;
      font-size: 15px;
      pointer-events: none;
      z-index: 10;
    }
    .cadflow-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #3d8bfd;
      border-radius: 50%;
      animation: cf-spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin-bottom: 18px;
    }
    @keyframes cf-spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: #f0f3f6;
    }
    .loading-sub {
      font-size: 13px;
      color: #8c95a0;
    }

    /* 原生 Markdown 浮层及 EasyMDE 暗黑主题适配样式 */
    #doc-easymde-overlay {
      position: fixed;
      z-index: 20;
      box-sizing: border-box;
      overflow: hidden;
      display: none;
      background-color: #1b1b1f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #doc-easymde-overlay .EasyMDEContainer {
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: #1b1b1f;
    }
    #doc-easymde-overlay .editor-toolbar {
      background-color: #202026;
      border: none;
      border-bottom: 1px solid #2d2d34;
      border-radius: 0;
      padding: 4px 8px;
    }
    #doc-easymde-overlay .editor-toolbar button {
      color: #b4b4be !important;
    }
    #doc-easymde-overlay .editor-toolbar button:hover,
    #doc-easymde-overlay .editor-toolbar button.active {
      background-color: #2d2d34 !important;
      border-color: #3e3e4a !important;
    }
    #doc-easymde-overlay .editor-toolbar i.separator {
      border-left-color: #2d2d34 !important;
      border-right-color: #2d2d34 !important;
    }
    #doc-easymde-overlay .CodeMirror {
      flex: 1;
      height: auto !important;
      background-color: #1b1b1f !important;
      color: #dcdce1 !important;
      border: none !important;
      border-radius: 0 !important;
      padding: 8px 12px;
      font-size: 14px;
      line-height: 1.6;
    }
    #doc-easymde-overlay .CodeMirror-cursor {
      border-left-color: #dcdce1 !important;
    }
    #doc-easymde-overlay .editor-preview-full,
    #doc-easymde-overlay .editor-preview {
      background-color: #1b1b1f !important;
      color: #dcdce1 !important;
      padding: 12px 16px;
    }
    #doc-easymde-overlay .editor-preview-side {
      background-color: #1b1b1f !important;
      color: #dcdce1 !important;
      border-left: 1px solid #2d2d34 !important;
    }
    #doc-easymde-overlay .editor-preview pre,
    #doc-easymde-overlay .editor-preview code {
      background-color: #121215 !important;
      color: #dcdce1 !important;
    }
  </style>
</head>
<body>
  <canvas id="cadcraft_canvas"></canvas>
  <div id="cadcraft_loading">
    <div class="cadflow-spinner"></div>
    <div class="loading-title">CADFlow</div>
    <div class="loading-sub">正在加载 WebAssembly 核心...</div>
  </div>
</body>
</html>
