<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>CADFlow - 数字化工程建模与文档协同平台</title>
  <link data-trunk rel="rust" data-bin="cadflow-web" data-wasm-opt="z" data-wasm-opt-params="--all-features" data-weak-refs />
  <link data-trunk rel="copy-dir" href="assets" />
  <link data-trunk rel="copy-file" href="_headers" />

  <!-- 引入 EasyMDE 与 FontAwesome 样式与脚本 -->
  <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #22282f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    #cadcraft_canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #cadcraft_loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #d7dbe0;
      font-size: 15px;
      pointer-events: none;
      z-index: 10;
    }
    .cadflow-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #3d8bfd;
      border-radius: 50%;
      animation: cf-spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin-bottom: 18px;
    }
    @keyframes cf-spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: #f0f3f6;
    }
    .loading-sub {
      font-size: 13px;
      color: #8c95a0;
    }

    /* 原生 Markdown 浮层及 EasyMDE VSCode 浅色文档主题适配样式 (Req 4, Req 5, Req 6) */
    #doc-easymde-overlay {
      position: fixed;
      z-index: 20;
      box-sizing: border-box;
      overflow: hidden;
      display: none;
      background-color: #ffffff;
      border-left: 1px solid #2d2d34;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    #doc-easymde-overlay .EasyMDEContainer {
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }
    /* 彻底去除 EasyMDE 自带工具栏（避免与主界面顶部工具栏重复，Req 4） */
    #doc-easymde-overlay .editor-toolbar {
      display: none !important;
    }
    /* CodeMirror 编辑器主体：白底、深灰字、舒适行高 (Req 5) */
    #doc-easymde-overlay .CodeMirror {
      flex: 1;
      height: 100% !important;
      background-color: #ffffff !important;
      color: #24292f !important;
      border: none !important;
      border-radius: 0 !important;
      padding: 12px 18px;
      font-size: 14px;
      line-height: 1.6;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    #doc-easymde-overlay .CodeMirror-cursor {
      border-left-color: #24292f !important;
    }
    #doc-easymde-overlay .CodeMirror-selected {
      background-color: #b4d5fe !important;
    }

    /* 参考 VSCode Markdown 编辑器中的标题字号与高亮 (Req 6) */
    #doc-easymde-overlay .CodeMirror .cm-header-1 {
      font-size: 1.45em !important;
      line-height: 1.35 !important;
      font-weight: 600 !important;
      color: #1f2328 !important;
    }
    #doc-easymde-overlay .CodeMirror .cm-header-2 {
      font-size: 1.25em !important;
      line-height: 1.35 !important;
      font-weight: 600 !important;
      color: #1f2328 !important;
    }
    #doc-easymde-overlay .CodeMirror .cm-header-3 {
      font-size: 1.12em !important;
      line-height: 1.35 !important;
      font-weight: 600 !important;
      color: #1f2328 !important;
    }
    #doc-easymde-overlay .CodeMirror .cm-header-4 {
      font-size: 1.05em !important;
      font-weight: 600 !important;
      color: #1f2328 !important;
    }
    #doc-easymde-overlay .CodeMirror .cm-header-5,
    #doc-easymde-overlay .CodeMirror .cm-header-6 {
      font-size: 1.0em !important;
      font-weight: 600 !important;
      color: #1f2328 !important;
    }
    #doc-easymde-overlay .CodeMirror .cm-strong {
      font-weight: 600 !important;
      color: #1f2328 !important;
    }
    #doc-easymde-overlay .CodeMirror .cm-em {
      font-style: italic !important;
      color: #1f2328 !important;
    }
    #doc-easymde-overlay .CodeMirror .cm-link,
    #doc-easymde-overlay .CodeMirror .cm-url {
      color: #0969da !important;
    }
    #doc-easymde-overlay .CodeMirror .cm-quote {
      color: #57606a !important;
    }
    #doc-easymde-overlay .CodeMirror .cm-comment {
      color: #57606a !important;
      background-color: #f6f8fa;
    }

    /* 参考 VSCode Markdown 预览样式：白底、适度字号、分隔线与表格排版 (Req 5, Req 6) */
    #doc-easymde-overlay .editor-preview-full,
    #doc-easymde-overlay .editor-preview {
      background-color: #ffffff !important;
      color: #24292f !important;
      padding: 16px 22px;
      font-size: 14px;
      line-height: 1.6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    #doc-easymde-overlay .editor-preview h1 {
      font-size: 1.5em !important;
      font-weight: 600 !important;
      padding-bottom: 0.3em;
      border-bottom: 1px solid #d0d7de;
      margin-top: 18px;
      margin-bottom: 12px;
      color: #1f2328 !important;
    }
    #doc-easymde-overlay .editor-preview h2 {
      font-size: 1.3em !important;
      font-weight: 600 !important;
      padding-bottom: 0.25em;
      border-bottom: 1px solid #d0d7de;
      margin-top: 16px;
      margin-bottom: 10px;
      color: #1f2328 !important;
    }
    #doc-easymde-overlay .editor-preview h3 {
      font-size: 1.15em !important;
      font-weight: 600 !important;
      margin-top: 14px;
      margin-bottom: 8px;
      color: #1f2328 !important;
    }
    #doc-easymde-overlay .editor-preview h4 {
      font-size: 1.05em !important;
      font-weight: 600 !important;
      color: #1f2328 !important;
    }
    #doc-easymde-overlay .editor-preview h5,
    #doc-easymde-overlay .editor-preview h6 {
      font-size: 1.0em !important;
      font-weight: 600 !important;
      color: #1f2328 !important;
    }
    #doc-easymde-overlay .editor-preview hr {
      border: none;
      border-bottom: 1px solid #d0d7de;
      margin: 16px 0;
    }
    #doc-easymde-overlay .editor-preview blockquote {
      margin: 12px 0;
      padding: 6px 14px;
      border-left: 4px solid #d0d7de;
      color: #57606a;
      background-color: #f6f8fa;
    }
    #doc-easymde-overlay .editor-preview pre {
      background-color: #f6f8fa !important;
      color: #1f2328 !important;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
    }
    #doc-easymde-overlay .editor-preview code {
      background-color: #f6f8fa !important;
      color: #1f2328 !important;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 85%;
    }
    #doc-easymde-overlay .editor-preview table {
      border-collapse: collapse;
      width: 100%;
      margin: 14px 0;
    }
    #doc-easymde-overlay .editor-preview table th,
    #doc-easymde-overlay .editor-preview table td {
      border: 1px solid #d0d7de;
      padding: 6px 12px;
    }
    #doc-easymde-overlay .editor-preview table th {
      background-color: #f6f8fa;
      font-weight: 600;
    }
    #doc-easymde-overlay .editor-preview table tr:nth-child(2n) {
      background-color: #f6f8fa;
    }
    #doc-easymde-overlay .editor-preview a {
      color: #0969da;
      text-decoration: none;
    }
    #doc-easymde-overlay .editor-preview a:hover {
      text-decoration: underline;
    }
    #doc-easymde-overlay .editor-preview ul,
    #doc-easymde-overlay .editor-preview ol {
      padding-left: 2em;
      margin: 8px 0;
    }
    #doc-easymde-overlay .editor-preview li {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <canvas id="cadcraft_canvas"></canvas>
  <div id="cadcraft_loading">
    <div class="cadflow-spinner"></div>
    <div class="loading-title">CADFlow</div>
    <div class="loading-sub">正在加载 WebAssembly 核心与中文字体...</div>
  </div>
</body>
</html>
